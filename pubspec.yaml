name: godly_seed_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0-236.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter

# General Packages
  http: ^1.2.1
  flutter_native_splash: ^2.2.16
  expandable_page_view: ^1.0.17
  smooth_page_indicator: ^1.0.0+2
  flutter_svg: ^2.0.10+1
  flutter_spinkit: ^5.1.0
  font_awesome_flutter: ^10.4.0
  carousel_slider: ^5.0.0
  #  country_picker: ^2.0.19
  shimmer: ^3.0.0
  styled_text: ^8.1.0
  flutter_switch: ^0.3.2
  device_info_plus: ^10.1.0
 
  webview_flutter: ^4.8.0
  intl: ^0.19.0
  
  scroll_edge_listener: ^0.1.1

  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.1.0
  flutter_screenutil: ^5.9.3 # make app responsive
  pinput: ^5.0.0

  logger: ^2.3.0 # log events in clear way instead of (print)

  # State management and network
  get: ^4.6.5
  connectivity_plus: ^6.0.5
  dio: ^5.4.1

  shared_preferences: ^2.2.3 # shared preferences persistence key value store
  hive: ^2.2.3 # local database (SQFlite replacement)
  hive_flutter: ^1.1.0 # make it easy to use hive (no need for path provider)

 
  # Media Players
  rxdart: ^0.28.0
  pod_player: ^0.2.2

  # UI Libraries
  fwfh_text_style: ^2.2.0
  flutter_custom_tab_bar: ^1.2.1
  flutter_rating_bar: ^4.0.1
  awesome_bottom_bar: ^1.2.4
  skeletonizer: ^1.4.2
  
  modal_bottom_sheet:
    git:
      url: https://github.com/danReynolds/modal_bottom_sheet.git
      path: modal_bottom_sheet

  flutter_secure_storage: ^9.2.2

  # Animation Libraries
  lottie: ^3.1.2
  animation_wrappers: ^3.0.0
  flutter_staggered_animations: ^1.1.1


  # In App Update Packages
  in_app_update: ^4.2.2
  upgrader: ^10.3.0

  # Notifications, Video and Audio Call

  url_launcher: ^6.1.11

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

flutter_native_splash:
 background_image: "assets/images/app_background.png"
image: "assets/images/app_logo.png"

#   color_dark: "#042a49"
#   background_image_dark: "assets/images/splash_screen_bg.png"
#   image_dark: "assets/images/logo.png"

#   #branding_dark: assets/dart_dark.png

#   # Android 12 handles the splash screen differently than previous versions.  Please visit
#   # https://developer.android.com/guide/topics/ui/splash-screen
#   # Following are Android 12 specific parameter.
#   android_12:
#     color: "#6369D1"
#     background_image: "assets/images/splash_screen_bg.png"
#     image: "assets/images/splash_logo.png"

#     color_dark: "#042a49"
#     background_image_dark: "assets/images/splash_screen_bg.png"
#     image_dark: "assets/images/splash_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: # generate dart files
  hive_generator: # generate hive files
  pub_semver: ^2.1.4 # helper to generate hive models
  # For information on the generic Dart part of this file, see the
  # following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    # - assets/icons/
    # - assets/audios/
    - assets/animated/
    - assets/svg_icons/
    - assets/gifs/

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend-Thin.ttf
          weight: 200
      

    - family: FunkySmile
      fonts:
        - asset: assets/fonts/FunkySmile-Regular.otf


    - family: BottomNavIcons
      fonts:
        - asset: assets/fonts/BottomNavIcons.ttf
